name: Release Mobile (release + build + submit)

# ---------------------------------------------------------------------------
# WHY GITHUB ACTIONS INSTEAD OF EAS CLOUD BUILDS
# ---------------------------------------------------------------------------
# EAS's free-tier build queue got too slow to be usable for release builds
# (an overnight Android production build sat in RUN_GRADLEW for ~4.5h before
# erroring out). GitHub Actions runners (macOS + Ubuntu) are free for this
# repo, so native binaries are built here with `eas build --local`, which
# runs the exact same build pipeline EAS's own workers run, just on our
# runner instead of theirs. EAS is now used ONLY for:
#   - fetching the project's remote credentials (signing identity,
#     provisioning profile, keystore) and EAS-server env vars/secrets
#     (GOOGLE_SERVICES_JSON, RevenueCat/PostHog keys, etc.) via EXPO_TOKEN
#   - store submission (`eas submit`), as a separate, manual-gated job
#
# `eas build --local` requires authentication (EXPO_TOKEN) to fetch both of
# those from EAS's servers, same as a cloud build would; the difference is
# only WHERE the compile/link/archive steps run.
# ---------------------------------------------------------------------------
# CREDENTIALS
# ---------------------------------------------------------------------------
# iOS signing uses EAS's remote credentials (managed via `eas credentials`),
# fetched non-interactively over the same EXPO_TOKEN auth. EAS sets them up
# per TARGET, not per app: the main app plus every extension listed under
# `extra.eas.build.experimental.ios.appExtensions`, which
# @bacons/apple-targets populates from apps/mobile/targets/*. Today:
#
#   Pegada                     app.pegada
#   PegadaWidgets              app.pegada.widgets
#   PegadaNotificationService  app.pegada.notificationservice
#
# In non-interactive mode eas-cli will only REUSE a distribution certificate
# that is already assigned to that specific target. SetUpDistributionCertificate
# has no branch that adopts an unassigned account certificate and none that
# creates one; it throws MissingCredentialsNonInteractiveError, printed as
# "Credentials are not set up. Run this command again in interactive mode."
# A target EAS has never seen therefore cannot be built from CI. That is what
# killed v1.5.0-rc1's iOS job seconds after it started (#104), on the first
# tag since the two extensions landed.
#
# An ASC API key (EXPO_ASC_API_KEY_PATH / EXPO_ASC_KEY_ID / EXPO_ASC_ISSUER_ID)
# does not substitute for that setup. rc1 was already authenticated with one
# ("Using App Store Connect API Key from EAS credentials service") and still
# failed at the certificate lookup, which happens before any profile work. The
# key also cannot link App Group identifiers: eas-cli's
# syncCapabilityIdentifiersForEntitlementsAsync bails out with "Skipping
# capability identifier syncing because the current Apple authentication
# session is not using Cookies", and app.pegada.widgets needs group.app.pegada
# linked to its App ID.
#
# So each new extension target costs one `eas credentials -p ios` run from
# apps/mobile against the production profile, signed in with the Apple ID
# (cookie auth, which is what syncs the App Group), reusing the existing
# distribution certificate. EAS mints and stores that target's provisioning
# profile once, and every later non-interactive build reuses it. Only Gabriel
# can do this; it needs App Store Connect access.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# WHEN THIS RUNS vs. WHEN OTA RUNS
# ---------------------------------------------------------------------------
# Most releases ship over-the-air: deploy-mobile.yml runs `eas update` on every
# push to main, which is the frequent path and needs no native build or store
# submission. This workflow is only for the rarer case where NATIVE actually
# changed (new/updated native dep, config plugin, permissions, version bump)
# and a fresh binary is required.
#
# A new native binary must NOT be auto-submitted to the stores: it needs
# TestFlight/internal-track testing and a deliberate staged rollout first. So:
#   - tag push (v*)        -> GitHub release + changelog, then builds
#                             artifacts, NEVER submits
#   - manual dispatch      -> submit is an explicit opt-in (defaults to false)
# `eas submit` is only ever reached when a human sets submit=true on a dispatch.
#
# Tags come from `./scripts/tag-release.sh`, which reads the version out of
# apps/mobile/app.config.ts and writes the generated release notes into the
# annotated tag's own message.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      submit:
        description: "Submit built artifact(s) to the store (opt-in; a brand-new native version normally ships to TestFlight/internal first, not straight to submit)"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: 1

jobs:
  # -------------------------------------------------------------------------
  # GitHub release + changelog. Deliberately has NO `needs:` on the build
  # jobs: the notes describe what's in the tag, which is knowable the second
  # the tag lands, and waiting 40-90 minutes for a native build to finish
  # before the release page exists is how this repo ended up with two tags
  # and zero releases.
  #
  # `.github/scripts/changelog.py` is the single source for release text. The
  # annotated tag's own message and CHANGELOG.md both come from the same
  # generator (via scripts/tag-release.sh), so the tag, the release body and the
  # changelog entry can't tell three different stories about the same commits,
  # and a breaking change (`feat!:` or a `BREAKING CHANGE:` footer) shows up in
  # all three plus the release title.
  # -------------------------------------------------------------------------
  github-release:
    name: GitHub release (notes + changelog)
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history and every tag: the generator diffs this tag against the
      # previous one, which a shallow clone doesn't have.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREVIOUS=$(git tag --list 'v*' --sort=-creatordate | grep -Fxv "$TAG" | head -1 || true)

          python3 .github/scripts/changelog.py \
            --notes "$TAG" \
            --previous "$PREVIOUS" \
            --repo "$GITHUB_REPOSITORY" \
            --output release-notes.md

          TITLE="$TAG"
          if python3 .github/scripts/changelog.py \
            --is-breaking "$TAG" --previous "$PREVIOUS" >/dev/null; then
            TITLE="$TAG (contains breaking changes)"
          fi
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          # Anything with a suffix after the version (-rc1, -beta.2) is not a
          # store release; GitHub should not mark it "Latest".
          if printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

          echo "::group::release notes"
          cat release-notes.md
          echo "::endgroup::"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.notes.outputs.title }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          else
            FLAGS+=(--latest)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              "${FLAGS[@]}"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              "${FLAGS[@]}"
          fi

      # Reports, never writes. The "Main" ruleset requires every change to
      # `main` to arrive through a squash-merged pull request, so a bot pushing
      # a changelog commit straight to the branch gets rejected with GH013 (it
      # did, on v1.5.0-rc1's first run) and takes the whole job red AFTER the
      # release was already published. Opening the PR from here instead doesn't
      # work either: a pull request created with GITHUB_TOKEN does not trigger
      # workflows, so its required checks would never report and the PR could
      # never merge.
      #
      # `./scripts/tag-release.sh` regenerates CHANGELOG.md locally while
      # cutting the tag, so the file is normally already committed by the time
      # this runs. This step exists to catch the case where someone tagged
      # without it, and it stays green either way; the release itself does not
      # depend on the file.
      - name: Check CHANGELOG.md is current
        run: |
          set -euo pipefail
          python3 .github/scripts/changelog.py \
            --all --repo "$GITHUB_REPOSITORY" --output CHANGELOG.md

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### CHANGELOG.md is stale"
            echo
            echo "Run \`pnpm changelog\` on \`main\` and open a PR with the result."
            echo
            echo '```diff'
            git --no-pager diff -- CHANGELOG.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # iOS: local EAS build on a macOS runner, production profile.
  # -------------------------------------------------------------------------
  build-ios:
    name: Build iOS (production, local)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      ipa-artifact: ${{ steps.vars.outputs.ipa-artifact }}
    steps:
      - name: Set vars
        id: vars
        run: echo "ipa-artifact=ios-production-ipa" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | sed 's|.*/Xcode_||;s|\.app$||' \
            | sort -V \
            | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode_*.app installed on runner"
            ls /Applications/ | grep -i xcode || true
            exit 1
          fi
          echo "Selecting Xcode $XCODE"
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app/Contents/Developer"
          xcodebuild -version

      - name: Checkout
        uses: actions/checkout@v7

      # `eas build --local` stages the project into an isolated working
      # copy (packages/eas-cli/src/vcs/local.ts's makeShallowCopyAsync)
      # that explicitly EXCLUDES anything matching .gitignore, which is
      # where GoogleService-Info.plist/google-services.json live. Writing
      # the real file into the GHA checkout before calling `eas build` is
      # a no-op: it never survives into that copy (confirmed in CI: Gradle
      # read a malformed/empty file from the copy's path even though our
      # written file validated fine in the checkout).
      #
      # apps/mobile's own `preinstall` script (setup:secret:files) already
      # exists to solve exactly this: it materializes these two files from
      # the GOOGLE_SERVICES_JSON / GOOGLE_SERVICE_INFO_PLIST env vars on
      # every `pnpm install`. So instead of writing files ourselves, we
      # decode our base64 GHA secrets into real env vars and let that
      # existing script do the writing.
      #
      # MUST run before the "Install dependencies" step below: confirmed
      # in CI that `eas build --local` does NOT reliably re-run `pnpm
      # install`/`preinstall` inside its own isolated copy (a prior run's
      # logs showed it doing so via INSTALL_DEPENDENCIES/PREBUILD phase
      # markers; this run didn't), so the only guaranteed opportunity for
      # `preinstall` to see the real value is the top-level install here.
      # If it also reruns internally, the hook's `[ ! -s file ]` guard
      # just no-ops on an already-populated file, which is harmless.
      #
      # Also fixed a latent bug in that script in the same PR: it used
      # unquoted `echo $VAR`, which word-splits on whitespace/newlines via
      # $IFS and mangles multi-line content like this plist/JSON; now
      # `printf '%s' "$VAR"` with proper quoting.
      #
      # Never echo the decoded contents anywhere (contains API keys).
      - name: Decode GoogleService secrets to env
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST_B64:-}" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST secret is not set"
            exit 1
          fi
          DECODED=$(printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode)
          # Sanity check without printing contents: must be well-formed XML plist.
          printf '%s' "$DECODED" | plutil -lint -
          DELIM="EOF_${GITHUB_RUN_ID}_${RANDOM}${RANDOM}"
          {
            echo "GOOGLE_SERVICE_INFO_PLIST<<$DELIM"
            printf '%s' "$DECODED"
            echo ""
            echo "$DELIM"
          } >> "$GITHUB_ENV"
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Keyed on Podfile.lock like e2e-mobile.yml. `eas build --local` runs
      # its own `pod install` internally during prebuild, this cache just
      # gives that step a warm CocoaPods cache to pull from.
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: apps/mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # EXPO_APPLE_TEAM_ID backs `ios.appleTeamId` in app.config.ts, which is
      # the only thing @bacons/apple-targets reads to stamp DEVELOPMENT_TEAM
      # onto the generated extension targets. Env vars DO survive into
      # `eas build --local`'s isolated working copy (files don't, see the
      # GoogleService steps above), so setting it on this step is enough.
      #
      # The failure branch translates eas-cli's "Credentials are not set up"
      # into the actual remediation. On its own that message names neither the
      # target that is missing credentials nor the command that fixes it, and
      # it arrives ~40s into a job the release notes have already shipped
      # ahead of, so it is easy to misread as a generic auth problem (it was:
      # #104's first diagnosis blamed the ASC API key, which is unrelated).
      - name: EAS build (iOS, production, local)
        working-directory: apps/mobile
        env:
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
        run: |
          set -uo pipefail

          if [ -z "${EXPO_APPLE_TEAM_ID:-}" ]; then
            echo "::warning::EXPO_APPLE_TEAM_ID is not set. Prebuild will write \`DevelopmentTeam = undefined\` into the widget and notification-service targets."
          fi

          if eas build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/Pegada.ipa" 2>&1 | tee "$RUNNER_TEMP/eas-ios.log"; then
            exit 0
          fi

          if ! grep -q "Credentials are not set up" "$RUNNER_TEMP/eas-ios.log"; then
            exit 1
          fi

          TARGET=$(grep -oE "Setting up credentials for target .*" "$RUNNER_TEMP/eas-ios.log" \
            | tail -1 \
            | sed 's/^Setting up credentials for target //')

          echo "::error::EAS has no stored iOS credentials for target ${TARGET:-unknown}. Run 'eas credentials -p ios' from apps/mobile, pick the production profile and that target, sign in with the Apple ID, and reuse the existing distribution certificate."
          {
            echo "### iOS credentials missing for \`${TARGET:-unknown}\`"
            echo
            echo "EAS stores signing credentials per target. This one has none, and"
            echo "\`--non-interactive\` can only reuse credentials that already exist."
            echo
            echo "Fix it once, from \`apps/mobile\`:"
            echo
            echo '```'
            echo "eas credentials -p ios"
            echo '```'
            echo
            echo "Pick the \`production\` profile and that target, sign in with the Apple ID"
            echo "(not an ASC API key, which cannot link App Group identifiers), and reuse"
            echo "the existing distribution certificate. See the CREDENTIALS block at the top"
            echo "of \`.github/workflows/release-mobile.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vars.outputs.ipa-artifact }}
          path: ${{ runner.temp }}/Pegada.ipa
          retention-days: 14

  # -------------------------------------------------------------------------
  # Android: local EAS build on an Ubuntu runner, production profile.
  # -------------------------------------------------------------------------
  build-android:
    name: Build Android (production, local)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    # A cold-cache first run on a 4-core hosted runner (no ~/.gradle to
    # restore, eas build --local doing its own prebuild on top of
    # gradlew bundleRelease) plausibly exceeds 60 minutes; this isn't
    # pathological; 90 gives headroom without masking a real hang.
    timeout-minutes: 90
    outputs:
      aab-artifact: ${{ steps.vars.outputs.aab-artifact }}
    steps:
      - name: Set vars
        id: vars
        run: echo "aab-artifact=android-production-aab" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7

      # See the long comment on the matching iOS step: `eas build --local`
      # stages an isolated copy of the project that excludes anything
      # .gitignore'd (which includes google-services.json), so a file we
      # write into the GHA checkout never survives into that copy.
      # Decode into an env var instead and let apps/mobile's own
      # `preinstall` script (setup:secret:files) write the file.
      #
      # MUST run before "Install dependencies" below: confirmed in CI that
      # `eas build --local` does not reliably re-run `pnpm
      # install`/`preinstall` inside its own isolated copy, so the
      # top-level install here is the only guaranteed opportunity for the
      # hook to see the real value. A run where this step came AFTER
      # install produced an empty google-services.json (the hook's `[ !
      # -s file ]` guard saw the env var as unset and wrote nothing).
      - name: Decode GoogleService secrets to env
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set"
            exit 1
          fi
          DECODED=$(printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode)
          # Sanity check without printing contents: must be well-formed JSON.
          printf '%s' "$DECODED" | python3 -m json.tool > /dev/null
          DELIM="EOF_${GITHUB_RUN_ID}_${RANDOM}${RANDOM}"
          {
            echo "GOOGLE_SERVICES_JSON<<$DELIM"
            printf '%s' "$DECODED"
            echo ""
            echo "$DELIM"
          } >> "$GITHUB_ENV"
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Gradle's own dependency/build cache. `eas build --local` runs
      # prebuild + `gradlew bundleRelease` internally; this just warms
      # ~/.gradle so that invocation doesn't start stone cold.
      #
      # Split into restore/save (rather than the combined actions/cache
      # action) so the save step can run with `if: always()`. The
      # combined action's save only fires from its own post-job hook,
      # which is NOT guaranteed to run if the job is killed by
      # timeout-minutes -- we want a slow/cold first run to still leave a
      # warm cache behind for the next attempt, timeout or not.
      - name: Restore Gradle cache
        id: gradle-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Root cause of the rc6 hang: the Gradle DAEMON hit its default
      # metaspace ceiling (~512 MiB, per Gradle's own
      # org.gradle.jvmargs default of -Xmx512m -XX:MaxMetaspaceSize=384m)
      # about 12 minutes into `gradlew :app:bundleRelease`, threw repeated
      # `OutOfMemoryError: Metaspace` from its idle RMI thread, and then
      # wedged (not crashed) rather than dying cleanly, leaving the whole
      # process tree alive but stuck for the remaining ~64 minutes with
      # zero log output until our step timeout finally killed it.
      #
      # EAS's own cloud build workers never hit this: their job config
      # explicitly sets GRADLE_OPTS="-Dorg.gradle.jvmargs=\"-XX:MaxMetaspaceSize=1g
      # -Xmx4g ...\" -Dorg.gradle.daemon=false" (confirmed against the
      # overnight cloud build's own logs). We match that here.
      #
      # Per Gradle's docs (config_gradle.html / build_environment.html):
      # GRADLE_OPTS configures the CLIENT jvm and "typically doesn't
      # affect the daemon" on its own; org.gradle.jvmargs is what actually
      # controls the JVM that runs the build (daemon or not). We set both:
      #   - org.gradle.jvmargs via ~/.gradle/gradle.properties: this path
      #     is the user's global Gradle config, it lives OUTSIDE
      #     apps/mobile entirely so `eas build --local`'s gitignore-
      #     filtered shallow copy (see the GoogleService comments above)
      #     can't drop it, and Gradle reads it regardless of which
      #     directory invokes gradlew.
      #   - GRADLE_OPTS with -Dorg.gradle.daemon=false on the build step's
      #     own env, since this IS explicitly forwarded via GRADLE_OPTS
      #     per Gradle's docs. A persistent daemon buys nothing on an
      #     ephemeral single-build CI runner anyway, and removes an entire
      #     class of "wedged background process" failure like this one.
      - name: Configure Gradle JVM memory (avoid daemon Metaspace OOM)
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          EOF
          cat ~/.gradle/gradle.properties

      # Step-level timeout shorter than the job's, on purpose: a job-level
      # timeout-minutes kill terminates the whole runner process tree
      # immediately, it does NOT let subsequent if: always() steps run
      # (that's different from a step merely failing, which DOES leave
      # the rest of the job to execute). To guarantee the Gradle cache
      # save below actually runs on a slow/hung build, this step must
      # fail on its own before the job-level ceiling hits, leaving
      # headroom in the job for the always() save step afterward.
      - name: EAS build (Android, production, local)
        working-directory: apps/mobile
        timeout-minutes: 80
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/pegada.aab"

      # Runs even if the build step above failed (including its own
      # step-level timeout above), so a slow cold run still leaves a warm
      # cache for the next attempt. Skips saving if we got an exact-key
      # cache hit (nothing changed, re-saving would be wasted work).
      - name: Save Gradle cache
        if: always() && steps.gradle-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache-restore.outputs.cache-primary-key }}

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vars.outputs.aab-artifact }}
          path: ${{ runner.temp }}/pegada.aab
          retention-days: 14

  # -------------------------------------------------------------------------
  # Submission: manual-gated. Only runs when `submit` input is explicitly
  # true (workflow_dispatch only; tag pushes never auto-submit). Downloads
  # whichever artifact(s) the build jobs produced and calls `eas submit`,
  # which pushes straight to app review, so this must stay opt-in.
  # -------------------------------------------------------------------------
  submit-ios:
    name: Submit iOS to App Store
    needs: build-ios
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit == true && (inputs.platform == 'all' || inputs.platform == 'ios') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download .ipa artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-ios.outputs.ipa-artifact }}
          path: artifact

      # `eas submit` evaluates apps/mobile/app.config.ts, which imports the
      # `expo` package -- without an install it dies with "Cannot find
      # package 'expo'" before ever talking to the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS submit (iOS)
        working-directory: apps/mobile
        run: |
          eas submit \
            --platform ios \
            --path "$GITHUB_WORKSPACE/artifact/Pegada.ipa" \
            --non-interactive

  submit-android:
    name: Submit Android to Play Store
    needs: build-android
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit == true && (inputs.platform == 'all' || inputs.platform == 'android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download .aab artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-android.outputs.aab-artifact }}
          path: artifact

      # Same as submit-ios: `eas submit` needs node_modules to evaluate the
      # Expo config before it can talk to the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS submit (Android)
        working-directory: apps/mobile
        run: |
          eas submit \
            --platform android \
            --path "$GITHUB_WORKSPACE/artifact/pegada.aab" \
            --non-interactive
