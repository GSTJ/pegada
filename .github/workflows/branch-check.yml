name: Branch Checkup
# NOTE: this workflow is push-triggered (branches-ignore: main), not
# pull_request-triggered, so there's no github.event.pull_request.draft
# to gate on here — GitHub still surfaces these runs on the PR because
# it associates push-to-branch runs with any open PR for that branch.
# Draft-gating (see e2e-mobile.yml) only applies to pull_request-triggered
# workflows; converting this trigger to pull_request would change the
# checkout ref (merge commit vs branch head) for no real benefit, since
# this job is cheap relative to e2e.
on:
  push:
    branches-ignore:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Dedupe runs alone first: it's a lockfile sanity check, not a per-task
  # matrix concern, and gating the matrix on it avoids paying for 3 parallel
  # setups when the lockfile itself is broken.
  dedupe:
    name: 🧹 Dedupe
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: 🏗 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Dedupe
        run: pnpm dedupe --check

  # Lint, format and typecheck come from GSTJ/magic — the same job every repo
  # on the shared tooling runs, so a change to the stack is made in one place.
  # It replaces a three-way matrix that paid its own ~40s setup per task; the
  # reusable job installs once and runs all three, which is the better trade
  # now that oxlint and oxfmt finish in under a second.
  checkup:
    name: 👮 Checkup
    needs: dedupe
    uses: GSTJ/magic/.github/workflows/ci.yml@b4800fa8d1f1f4cc1d954323624baeabf238117e # v1

  # Kept out of the shared checkup job: only this one needs a database, and
  # folding it in would spin up Postgres for typecheck/lint/format too. No
  # turbo cache step either — `test` is `cache: false` in turbo.json, so there
  # would be nothing to restore.
  test:
    name: 🔬 Test
    needs: dedupe
    runs-on: ubuntu-latest
    services:
      # PostGIS, not plain Postgres: schema.prisma declares the postgis
      # extension and the baseline migration creates it. Same image as
      # packages/database/docker-compose.test.yml, and the credentials,
      # port and database name have to match the DATABASE_URL committed in
      # .env.test, which is what `pnpm test` feeds to Prisma.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tony
          POSTGRES_PASSWORD: hawk
          POSTGRES_DB: pegava
        ports:
          - 3355:5432
        options: >-
          --health-cmd "pg_isready -U tony -d pegava"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 🏗 Setup Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: 🏗 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test` is `dotenv -e .env.test -- turbo test`, and the api
      # package's `pretest` runs `prisma migrate deploy` against the service
      # container above before jest starts.
      - name: 🔬 Test
        run: pnpm test
