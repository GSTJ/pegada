version: "3.1"

name: "pegada-dev-environment"

services:
  postgres:
    container_name: pegada-postgres
    image: postgis/postgis
    # Same as the test compose: no arm64 manifest for postgis/postgis.
    platform: linux/amd64
    shm_size: 128mb
    restart: always
    environment:
      POSTGRES_USER: tony
      POSTGRES_PASSWORD: hawk
      POSTGRES_DB: pegada
    ports:
      - "3356:5432"

  redis:
    container_name: pegada-redis
    image: redis:alpine
    command: redis-server
    restart: always
    ports:
      - "6379:6379"

  redis-serverless:
    container_name: pegada-redis-serverless
    image: hiett/serverless-redis-http:latest
    restart: always
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: example_token
      SRH_CONNECTION_STRING: "redis://redis:6379"

  # Dev/e2e-only S3 stand-in so image uploads work without AWS credentials.
  # The API points at it via AWS_S3_ENDPOINT (see packages/api config).
  # Port 9002 to avoid clashing with other local MinIO/S3 tooling on 9000.
  minio:
    container_name: pegada-minio
    image: minio/minio:latest
    command: server /data
    restart: always
    environment:
      MINIO_ROOT_USER: pegada-dev
      MINIO_ROOT_PASSWORD: pegada-dev-secret
    ports:
      - "9002:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Creates the bucket the API expects, because `minio server` does not.
  #
  # Without this a fresh clone gets a running S3 with nothing in it, and the
  # upload path fails in the worst possible way: `image.signedUpload` mints a
  # presigned PUT and answers 200, the device's PUT then 404s NoSuchBucket,
  # and nothing on either side treats that as an error. The photo silently
  # never attaches, so "Create Profile" is a no-op and onboarding dead-ends on
  # a screen with no message on it. It cost a full capture round to diagnose
  # (.unistyles-migration/baseline-report.md, "What changed to get here").
  #
  # `mc anonymous set download` matches how the app reads images back: the API
  # hands the client a plain bucket URL, not a presigned GET.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # One-shot. `always` would put it in a crash loop the moment it succeeds.
    restart: "no"
    environment:
      # Same default as packages/api's AWS_S3_BUCKET_NAME, overridable so a
      # checkout pointed at a differently-named bucket still self-provisions.
      BUCKET: "${AWS_S3_BUCKET_NAME:-pegada-dev}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set pegada http://minio:9000 pegada-dev pegada-dev-secret
        mc mb --ignore-existing "pegada/$${BUCKET}"
        mc anonymous set download "pegada/$${BUCKET}"
        echo "minio-init: bucket $${BUCKET} ready"
