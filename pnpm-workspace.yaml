packages:
  - packages/*
  - apps/*

# Everything below used to live in package.json under the "pnpm" key and in
# .npmrc. pnpm 11 stopped reading either for these settings — it warns
# "The pnpm field in package.json is no longer read by pnpm" and then installs
# without the patches and overrides, which is how an unpatched
# styled-components ends up in a release build.
nodeLinker: hoisted
dedupeDirectDeps: true

supportedArchitectures:
  os:
    - win32
    - darwin
    - current
  cpu:
    - x64
    - arm64

patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch
  react-native-draggable-grid@2.2.1: patches/react-native-draggable-grid@2.2.1.patch
  styled-components@6.1.11: patches/styled-components@6.1.11.patch
  redux-saga@1.3.0: patches/redux-saga@1.3.0.patch
  minimatch@3.1.5: patches/minimatch@3.1.5.patch
  minimatch@9.0.9: patches/minimatch@9.0.9.patch

overrides:
  "@react-native-async-storage/async-storage": 2.2.0
  react-native-svg: 15.15.3
  "@xmldom/xmldom": ^0.8.13
  brace-expansion: ^5.0.9
  braces: ^3.0.3
  diff@4: ^4.0.4
  esbuild: ^0.28.1
  fast-uri: ^3.1.4
  fast-xml-parser: ^5.7.0
  form-data: ^4.0.6
  dompurify: ^3.4.13
  image-size@1: ^1.2.1
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  mdast-util-to-hast: ^13.2.1
  micromatch: ^4.0.8
  minimatch@3: ^3.1.4
  minimatch@9: ^9.0.7
  nanoid@3: ^3.3.18
  on-headers: ^1.1.0
  picomatch@2: ^2.3.2
  postcss: ^8.5.18
  sharp: ^0.35.3
  shell-quote: ^1.9.0
  svgo@3: ^3.3.4
  uuid: ^11.1.1
  ws@7: ^7.5.11
  ws@8: ^8.21.0

# pnpm 11 refuses to resolve a version published less than `minimumReleaseAge`
# ago. These exact versions were already reviewed and committed before the
# 14-day guard landed; future versions still have to age normally.
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  - "@emnapi/runtime@1.11.3"
  - "@eslint-community/eslint-utils@4.10.1"
  - "@next/env@15.5.22"
  - "@next/swc-darwin-arm64@15.5.22"
  - "@next/swc-darwin-x64@15.5.22"
  - "@next/swc-linux-arm64-gnu@15.5.22"
  - "@next/swc-linux-arm64-musl@15.5.22"
  - "@next/swc-linux-x64-gnu@15.5.22"
  - "@next/swc-linux-x64-musl@15.5.22"
  - "@next/swc-win32-arm64-msvc@15.5.22"
  - "@next/swc-win32-x64-msvc@15.5.22"
  - "@posthog/browser-common@0.2.1"
  - "@posthog/core@1.45.1"
  - "@posthog/types@1.398.0"
  - baseline-browser-mapping@2.11.3
  - brace-expansion@5.0.9
  - dompurify@3.4.13
  - electron-to-chromium@1.5.396
  - eslint-plugin-safe-jsx@1.3.0
  - fast-uri@3.1.5
  - flatted@3.4.3
  - js-yaml@3.15.1
  - js-yaml@4.3.1
  - "magic-*"
  - nanoid@3.3.18
  - next@15.5.22
  - node-stream-zip@1.16.0
  - postcss@8.5.23
  - posthog-js@1.407.2
  - sax@1.6.1

# pnpm 10+ does not run dependency install scripts unless they are listed here,
# and pnpm 11 makes an unanswered list a hard install failure. Every entry ran
# under pnpm 9; core-js is the only one turned off, because its postinstall only
# prints a funding banner.
allowBuilds:
  "@parcel/watcher": true
  "@posthog/cli": true
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  core-js: false
  esbuild: true
  prisma: true
