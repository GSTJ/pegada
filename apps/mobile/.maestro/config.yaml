flows:
excludeTags:
  - util
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - 01-launch
    - 02-sign-in
    - 03-create-profile
    - 04-complete-profile
    - 05-ask-location
    - 06-force-update
    - 07-tabs-navigation
    - 08-swipe-like
    - 09-swipe-dislike
    - 10-dog-profile
    - 11-messages-list
    - 12-chat-conversation
    - 19-chat-message-order
    - 25-upgrade-journey
    - 20-account-creation-journey
    - 21-swipe-journey
    - 22-new-match-journey
    - 23-preferences-journey
    - 23b-lang-theme-persistence
    - 24-profile-journey
    # 30-35 are the regression guards for the six findings of the iOS app
    # tour. They run after the journeys because 34 back-dates the seeded
    # Rex<->Bella conversation, which flows 11/12/19 read.
    - 30-create-profile-bio-keyboard
    - 31-edit-profile-save-seeded-images
    - 32-edit-profile-input-keyboard
    - 33-otp-resend-underline
    - 34-chat-day-separator
    - 35-photo-skip-affordance
    # 36-41 are the regression guards for the six findings of the Android app
    # tour. Every one of them is a platform behaviour iOS does not have, so
    # they assert through signals that read the same on both: an element under
    # the Android IME drops out of the accessibility tree, which is what
    # `assertVisible` sees. The Android-only measurements (IME insets, status
    # bar pixels, `mInputShown`) live in checks/36-41 and no-op on iOS.
    - 36-signin-signup-keyboard-clearance
    - 37-chat-composer-keyboard
    - 38-status-bar-legibility
    - 39-location-map-pan-chrome
    - 40-preferences-sheet-back-and-keyboard
    - 41-otp-digits-only-keypad
    # 42 is the half of finding #1 the first fix missed: a screen ENTERED with
    # the keyboard already up never sees `keyboardDidShow`, so it never
    # consumed the IME inset at all.
    - 42-otp-resend-keyboard-clearance
    - 26-logout-journey
    # 27 MUST run last — it hard-deletes the delete-me@pegada.app row. The
    # row is re-seeded by `pnpm -F @pegada/database maestro:seed` before
    # every test run (see packages/database/maestro-seed.ts), but other
    # flows have no reason to rerun this expensive teardown mid-suite.
    - 27-delete-account-journey
