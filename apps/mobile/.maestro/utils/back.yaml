appId: ${APP_ID}
name: util - go back one screen
tags:
  - util
---
# iOS: tap the standard back chevron at top-left. The point is calibrated on
# the iPhone 17 Pro / Pro Max header, which is why it is not a testID — the
# chevron is @react-navigation's own and carries none.
#
# Android: the system Back button does the same thing and needs no coordinate,
# which also makes this util survive a different screen size.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "10%, 9%"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- waitForAnimationToEnd
